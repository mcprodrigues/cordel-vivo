[project]
name = "cordel-api"
version = "0.1.0"
description = "Cordel Vivo HTTP API."
requires-python = ">=3.12,<3.13"
dependencies = ["cordel-contracts"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cordel_api"

[tool.uv.sources]
cordel-contracts = { workspace = true }
