[project]
name = "cordel-vivo"
version = "0.1.0"
description = "Searchable archive of Brazilian cordel booklets."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic==2.14.4",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "psycopg[binary]==3.3.9",
    "pytest==9.2.0",
    "pytest-socket==0.8.1",
    "pyyaml==6.0.4",
    "ruff==0.17.6",
    "types-pyyaml==6.0.12.20261122",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--ignore-glob=*_live.py",
    "--disable-socket",
    "-m", "not db",
]
python_files = ["test_*.py"]
markers = ["db: needs a migrated Postgres at CORDEL_DB_URL (run with -m db)"]
