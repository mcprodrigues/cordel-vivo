[project]
name = "cordel-vivo"
version = "0.1.0"
description = "Searchable archive of Brazilian cordel booklets (uv workspace root)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["cordel-contracts", "cordel-poetics", "cordel-api"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
cordel-contracts = { workspace = true }
cordel-poetics = { workspace = true }
cordel-api = { workspace = true }

[dependency-groups]
dev = [
    "import-linter==2.17",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["packages", "services", "tests"]
explicit_package_bases = true
mypy_path = ["packages/contracts/src", "packages/poetics/src", "services/api/src"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "services"]
addopts = ["--import-mode=importlib", "--strict-markers", "--ignore-glob=*_live.py"]
python_files = ["test_*.py"]

[tool.importlinter]
root_packages = ["cordel_contracts", "cordel_poetics", "cordel_api"]

[[tool.importlinter.contracts]]
name = "poetics is independent of contracts and services"
type = "forbidden"
source_modules = ["cordel_poetics"]
forbidden_modules = ["cordel_contracts", "cordel_api"]

[[tool.importlinter.contracts]]
name = "contracts does not depend on poetics or services"
type = "forbidden"
source_modules = ["cordel_contracts"]
forbidden_modules = ["cordel_poetics", "cordel_api"]
